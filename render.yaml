services:
  - type: web
    runtime: static
    name: macs-old-house
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /assets/video/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
